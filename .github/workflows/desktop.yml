name: Desktop build

# Packages the Electron desktop build on every pull request and push to
# master, so the desktop app is verified before merge. The macOS job runs on
# a macOS runner (required to produce the .dmg/.app). Code signing and
# notarization are not configured yet; adding them requires CI-stored
# certificates (see README "Desktop").

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            # Headless: software WebGL (no GPU), and the app is launched under
            # xvfb (see the smoke step) because there is no physical display.
            smokeFlags: --disable-gpu --use-gl=angle --use-angle=swiftshader
            smokePrefix: xvfb-run --auto-servernum
          - runner: windows-latest
            target: win
            smokeFlags: --disable-gpu --use-gl=angle --use-angle=swiftshader
            smokePrefix: ""
          - runner: macos-latest
            target: mac
            # macos-latest is a real M1 Mac with a Metal GPU and a display,
            # so the app runs on the native GPU (no flags). --disable-gpu
            # would kill WebGL there, and the arm64 Electron build ships no
            # SwiftShader to fall back on.
            smokeFlags: ""
            smokePrefix: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install display server (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build web app + main process
        run: npm run build && npx tsc -p electron/tsconfig.json

      - name: Package
        run: npm run dist -- --${{ matrix.target }}

      # `dist` only produces installers; the smoke needs a runnable unpacked
      # app, so build one (release/*-unpacked or *.app, per platform).
      - name: Build unpacked app
        run: npx electron-builder --dir --${{ matrix.target }}

      # Boots the packaged executable the same way the installed binary does
      # and plays through menu → tower placement → first wave, so a broken
      # build (e.g. a WebGL or config-loading failure) fails CI instead of
      # shipping.
      #   --no-sandbox: no setuid sandbox helper on runners.
      #   software WebGL (--use-angle=swiftshader) since runners have no
      #   usable GPU; on Linux the app also runs under xvfb (no display).
      - name: Smoke test the packaged app
        run: |
          set -e
          if [ -n "${{ matrix.smokePrefix }}" ]; then
            ${{ matrix.smokePrefix }} npm run smoke:desktop -- --unpacked --no-sandbox ${{ matrix.smokeFlags }}
          else
            npm run smoke:desktop -- --unpacked --no-sandbox ${{ matrix.smokeFlags }}
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

name: CI

# Verifies the app on every pull request and push to master: builds the web
# app, runs the RTTR unit tests, runs the default Playwright e2e suite
# (menu → game flows; the stress scene is excluded and has its own local
# tooling, see stress/README.md), and lints PR commit messages with
# commitlint (Conventional Commits). The repo is public, so these runs are free.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# The job only reads the repository and runs tests; no write access needed.
permissions:
  contents: read

jobs:
  ci:
    name: Build, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # The Playwright config starts the dev server itself (webServer) and
      # uses CI-appropriate settings (single worker, retries) when the CI
      # env var is set, which GitHub Actions provides automatically.
      - name: E2E tests
        run: npm run test:e2e

      # The PWA suite builds first, then serves the built app through
      # `vite preview` (the config handles both) so the service worker
      # registration guard (production + secure origin) holds — unlike the
      # dev-server suite, which excludes pwa.spec.ts.
      - name: PWA E2E tests
        run: npm run test:e2e:pwa

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # Backstop for the local `commit-msg` hook (commitlint): checks the commit
  # messages of every PR against Conventional Commits.
  commitlint:
    name: Commit messages
    # `github.event.pull_request.base.ref` only exists on PR events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: the full history is needed to diff the PR's commits
      # against the base branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `--from`/`--to` lints every commit in the PR (base..head) as its own
      # message, so one bad subject cannot hide behind another. Git-generated
      # messages (merge commits, reverts, squash messages) are ignored
      # automatically by commitlint's default ignore rules.
      - name: Lint commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}
